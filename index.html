<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Struje - Grafikoni</title>
    <!-- Chart.js biblioteka za grafikone -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f9; max-width: 600px; margin: auto; }
        h2, h3 { text-align: center; color: #333; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
        .btn-danger { background: #dc3545; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #f0f0f0; }
        .chart-box { width: 100%; margin: 15px 0; }
        .chart-pita { max-width: 300px; margin: 0 auto; }
    </style>
</head>
<body>

    <h2>Kalkulator Struje</h2>

    <div class="card">
        <h3>Unos novog računa</h3>
        <input type="text" id="korisnik" placeholder="Ime / Član (npr. Sprat 1)">
        <input type="number" id="potrosnja" placeholder="Potrošeno kWh ili Iznos (RSD)">
        <button onclick="dodajStavku()">Dodaj u račun</button>
    </div>

    <!-- Stubičasti grafikon -->
    <div class="card">
        <h3>Poređenje potrošnje (Stubičasti)</h3>
        <div class="chart-box">
            <canvas id="stubicastiGrafikon"></canvas>
        </div>
    </div>

    <!-- Pita grafikon -->
    <div class="card">
        <h3>Procenat učešća (Pita)</h3>
        <div class="chart-box chart-pita">
            <canvas id="pitaGrafikon"></canvas>
        </div>
    </div>

    <div class="card">
        <h3>Pregled unetih podataka</h3>
        <table>
            <thead>
                <tr>
                    <th>Član</th>
                    <th>Iznos / kWh</th>
                    <th>Akcija</th>
                </tr>
            </thead>
            <tbody id="tabela-podaci"></tbody>
        </table>
        <button onclick="obrisiSve()" class="btn-danger" style="margin-top: 15px;">Obriši sve podatke</button>
    </div>

    <script>
        let podaci = JSON.parse(localStorage.getItem('podaciStruja')) || [];
        let grafikonPita = null;
        let grafikonStub = null;

        function sacuvajIosvezi() {
            localStorage.setItem('podaciStruja', JSON.stringify(podaci));
            prikaziTabelu();
            nacrtajGrafikone();
        }

        function dodajStavku() {
            const korisnik = document.getElementById('korisnik').value.trim();
            const potrosnja = parseFloat(document.getElementById('potrosnja').value);

            if (!korisnik || isNaN(potrosnja) || potrosnja <= 0) {
                alert('Molimo unesite ispravno ime i potrošnju.');
                return;
            }

            podaci.push({ korisnik, potrosnja });
            document.getElementById('korisnik').value = '';
            document.getElementById('potrosnja').value = '';
            sacuvajIosvezi();
        }

        function obrisiStavku(index) {
            podaci.splice(index, 1);
            sacuvajIosvezi();
        }

        function obrisiSve() {
            if (confirm('Da li ste sigurni da želite da obrišete sve podatke?')) {
                podaci = [];
                sacuvajIosvezi();
            }
        }

        function prikaziTabelu() {
            const tbody = document.getElementById('tabela-podaci');
            tbody.innerHTML = '';
            podaci.forEach((item, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.korisnik}</td>
                        <td>${item.potrosnja}</td>
                        <td><button onclick="obrisiStavku(${index})" class="btn-danger" style="padding: 5px;">X</button></td>
                    </tr>
                `;
            });
        }

        function nacrtajGrafikone() {
            const imena = [];
            const vrednosti = [];
            
            // Grupisanje potrošnje
            podaci.forEach(item => {
                const postojeciIndex = imena.indexOf(item.korisnik);
                if (postojeciIndex > -1) {
                    vrednosti[postojeciIndex] += item.potrosnja;
                } else {
                    imena.push(item.korisnik);
                    vrednosti.push(item.potrosnja);
                }
            });

            const boje = ['#36A2EB', '#FF6384', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];

            // 1. Stubičasti Grafikon
            const ctxStub = document.getElementById('stubicastiGrafikon').getContext('2d');
            if (grafikonStub) grafikonStub.destroy();
            grafikonStub = new Chart(ctxStub, {
                type: 'bar',
                data: {
                    labels: imena,
                    datasets: [{
                        label: 'Potrošnja (kWh / RSD)',
                        data: vrednosti,
                        backgroundColor: boje.slice(0, imena.length)
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });

            // 2. Pita Grafikon
            const ctxPita = document.getElementById('pitaGrafikon').getContext('2d');
            if (grafikonPita) grafikonPita.destroy();
            grafikonPita = new Chart(ctxPita, {
                type: 'pie',
                data: {
                    labels: imena,
                    datasets: [{
                        data: vrednosti,
                        backgroundColor: boje.slice(0, imena.length)
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // Inicijalno učitavanje
        prikaziTabelu();
        nacrtajGrafikone();
    </script>
</body>
</html>
